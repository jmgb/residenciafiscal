# UV project configuration
[project]
name = "residenciafiscal"
version = "0.1.0"
description = "Análisis LLM de sentencias judiciales españolas sobre residencia fiscal (Art. 9 LIRPF)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "jurisprudencia", "residencia-fiscal", "irpf", "legal-tech", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # LLM providers
    "openai>=2.54.0,<4.0.0",
    "groq>=1.7.0,<2.0.0",
    "google-genai>=2.20.0,<3.0.0",
    # PDF / datos / exports
    # Pin exacto: los artefactos verbatim y los casos de jurisprudencia
    # guardan la versión del extractor, y verbatim_validation.py la compara
    # con la instalada. Todo lo versionado hoy se extrajo con 6.14.2, así
    # que cualquier otra versión invalida los artefactos. Subirla exige
    # regenerarlos y revisar los bytes resultantes.
    "pypdf==6.16.2",
    # Runtime
    "aiohttp>=3.14.3,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    "python-dotenv>=1.2.3,<2.0.0",
    # API HTTP (make dev)
    "fastapi[standard]>=0.141.1,<1.0.0",
    "uvicorn[standard]>=0.52.4,<1.0.0",
    "sentry-sdk[fastapi]>=2.68.1,<3.0.0",
    "rapidfuzz>=3.14.5,<4.0.0",
    "pyyaml>=6.0.3,<7.0",
    # Pin exacto: la 0.7.0 trajo lo que este proyecto parcheaba a mano
    # —esquema estricto normalizado y `supports_temperature`—; la 0.8.0 hace que
    # `Execution.model_used` respete el id que reporta el proveedor, y ese valor
    # es el que el comparador publica como modelo de la respuesta; la 0.9.0 hace
    # que un `response_schema` llegue a los proveedores que no lo imponen, y la
    # 0.10.x deja el enrutado de fallback gobernado solo por el catálogo.
    "neutral-llm-gateway[gemini,groq,openai,openrouter]==0.14.1",
]

# Va después de `dependencies`: en TOML todo lo que sigue a una cabecera de tabla
# pertenece a esa tabla, así que declarar [project.urls] antes convertiría
# `dependencies` en `project.urls.dependencies` y uv vaciaría el lock.
[project.urls]
Homepage = "https://residenciafiscal.org"
Repository = "https://github.com/jmgb/residenciafiscal"
Issues = "https://github.com/jmgb/residenciafiscal/issues"

[tool.uv]
# NO instalar el proyecto como paquete: los módulos conservan imports planos
# dentro de src/ para mantener estable la API interna durante esta reorganización.
package = false


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "httpx2>=2.12.0,<3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "tests"]
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", ".venv", "output", "tests/test_outputs", "**/*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, lo gestiona el formatter
    "B008",  # llamadas en defaults de argumentos (patrón de FastAPI Depends/File)
    "C901",  # demasiado complejo
]

[tool.ruff.lint.isort]
known-first-party = ["api", "chat_model_policy", "config", "gateway_setup"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
mypy_path = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
warn_return_any = false
warn_unreachable = false
# El pipeline usa libs sin stubs (pypdf, groq)
ignore_missing_imports = true
exclude = [
    "^venv/",
    "^\\.venv/",
    "^output/",
]

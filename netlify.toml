[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"
  ignore = 'if [ -z "$CACHED_COMMIT_REF" ] || [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- ":/frontend" ":/knowledge/jurisprudencia-v3/publico" ":/netlify.toml"'

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; manifest-src 'self'; script-src 'self' https://www.googletagmanager.com https://eu.i.posthog.com; script-src-elem 'self' https://www.googletagmanager.com https://eu.i.posthog.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://www.google-analytics.com https://analytics.google.com https://eu.i.posthog.com; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com https://o4505440440090624.ingest.us.sentry.io https://eu.i.posthog.com"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify hace match por la ruta pedida, no por el fichero servido: una regla
# para "/index.html" no cubre a quien entra por "/". Sin `no-store`, que
# desactivaría también el back/forward cache del móvil; de la versión nueva se
# encarga la comprobación en runtime contra /version.json.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Ninguno lleva hash en el nombre y todos se regeneran en cada build. Tienen
# ETag, así que revalidar cuesta un 304 vacío; el `max-age=3600` anterior
# garantizaba hasta una hora de corpus viejo después de un deploy.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/manifiesto"
  to = "/manifiesto/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/metodologia"
  to = "/metodologia/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/espana/fuentes"
  to = "/espana/fuentes/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/colaborar"
  to = "/colaborar/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/privacidad"
  to = "/privacidad/index.html"
  status = 200
  force = true

# La home real del sitio es `/espana`: es la que publica el sitemap con
# prioridad 1.0 y la que el prerenderizado escribe con contenido. `/` servía
# `dist/index.html`, que conserva el `<div id="root">` vacío porque el
# prerenderizado no toca la shell, así que un rastreador que no ejecute
# JavaScript recibía una página en blanco con `canonical` hacia sí misma.
# `force` es imprescindible: el fichero existe, y sin él Netlify lo sirve en vez
# de redirigir.
[[redirects]]
  from = "/"
  to = "/espana"
  status = 301
  force = true

# El fallback de abajo captura cualquier ruta, incluidos los ficheros que la SPA
# pide por `fetch` o como módulo. Sin estas dos reglas, un chunk borrado por un
# deploy nuevo devuelve la shell HTML con 200 y las cabeceras `immutable` de
# /assets/*: el navegador guarda un año HTML disfrazado de JavaScript. Netlify
# solo aplica una redirección si el fichero no existe, así que los assets reales
# se siguen sirviendo.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404

# Únicas rutas sin fichero físico que deben servir la SPA: la interfaz de
# consulta y las conversaciones. Van antes del fallback porque este ya no
# devuelve la shell.
[[redirects]]
  from = "/consulta"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/c/*"
  to = "/index.html"
  status = 200

# Toda ruta pública tiene fichero prerenderizado y las de aplicación tienen su
# regla arriba, así que lo que llega aquí no existe. Antes el fallback devolvía
# la shell con 200, `robots: index` y canonical hacia `/` —que además
# redirige—: un soft 404 por cada URL inventada. La función del chat no pasa
# por aquí: declara su propio path `/api/chat`.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Deploy Preview: el renderer jurisprudencial privado.
#
# Los 67 candidatos siguen en `internal_preview` porque su análisis es
# `AGENT_REVIEWED`, así que un build de producción no materializa ninguna ficha
# —sin fichero ni regla, el fallback de arriba devuelve un 404 real—. El preview
# sí las construye para que una persona pueda revisarlas.
#
# La cabecera `X-Robots-Tag` va **además** del `noindex` que cada ficha lleva en
# su HTML: si alguien comparte la URL del preview, ni el HTML ni la respuesta
# HTTP permiten indexarla.
[context.deploy-preview.environment]
  SENTENCIAS_PREVIEW = "1"

[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"

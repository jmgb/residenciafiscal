# Actualizaciones automáticas de dependencias.
#
# Agrupadas para que no lleguen 15 PRs sueltos: el gate de CI corre entero en
# cada PR, así que un PR agrupado por ecosistema cuesta lo mismo de revisar que
# uno individual y da mucho menos ruido.
#
# `uv` es un ecosistema soportado nativamente por Dependabot y actualiza
# pyproject.toml + uv.lock a la vez, que es justo lo que exige `uv sync --locked`
# en ci.yml.
version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev:
        dependency-type: "development"
      python-runtime:
        dependency-type: "production"
    ignore:
      # `pypdf` está pineado en `==6.14.2` a propósito: los artefactos verbatim
      # y los casos de jurisprudencia guardan `extractor: pypdf/6.14.2` y
      # `verbatim_validation.py` lo compara con la versión instalada, así que
      # cualquier otra invalida el corpus hasta regenerarlo y revisar los bytes.
      # Sin esto, el bump vuelve cada lunes dentro del grupo `python-runtime` y
      # arrastra al resto del grupo a un PR que no se puede mergear.
      - dependency-name: "pypdf"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-dev:
        dependency-type: "development"
      frontend-runtime:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

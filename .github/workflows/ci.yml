name: CI

# Gate mínimo: convierte `make fast-check` (lint + format + typecheck + tests) en un check
# real de CI, en vez de depender de que alguien lo corra en local.
#
# NO necesita secrets: los tests de tests/ no llaman a ningún LLM. Los que sí
# gastan están tras el marker `manual_real_llm`, excluido por defecto vía
# `addopts` en pyproject.toml. Si algún día se añade un job que gaste API real,
# tiene que ser un workflow aparte con `workflow_dispatch`, nunca este.
#
# Seguridad: este workflow no interpola ninguna entrada controlable por terceros
# (github.event.*) dentro de un `run:`. Si se añade alguna, pasarla por `env:`
# y citarla, nunca inline en el shell.

# paths-ignore en vez de paths: así un fichero .py nuevo en la raíz dispara el gate
# sin tener que acordarse de añadirlo a una lista.
#
# `frontend/**` NO se ignora, aunque tenga su propio workflow: hay tests de pytest
# que leen ficheros del frontend (test_frontend_seo_assets.py valida
# frontend/public/robots.txt, sitemap.xml y llms.txt). Si lo ignorásemos, tocar
# robots.txt no dispararía este gate y frontend.yml no corre pytest, así que ese
# test se podría romper sin que ningún workflow se enterase. Correr el gate de
# Python de más en cambios solo-frontend cuesta ~1 min; el agujero costaba más.
#
# El ignore de Markdown es `*.md` y no `**.md` por el mismo motivo: los corpus de
# `knowledge/` son ficheros .md **generados**, y hay tests que los validan contra
# su fuente (la literalidad del articulado en test_normativa_boe.py, el perfil OKF
# en test_okf_bundle.py). Con `**.md`, editar a mano un precepto o un perfil no
# disparaba ningún gate y el invariante que esos tests protegen se podía romper en
# silencio. `*.md` no cruza `/`, así que README.md y CLAUDE.md siguen exentos.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'sentencias/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'sentencias/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: lint + format + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py313-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py313-

      # --locked falla si uv.lock no está sincronizado con pyproject.toml:
      # así el lock no se queda atrás silenciosamente.
      - name: Install dependencies
        env:
          UV_HTTP_TIMEOUT: 120
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest -q

name: Frontend

# Gate del frontend (Vite + React + TS, biome, vitest): el equivalente de ci.yml
# para `frontend/`. Corre `npm run fast-check` desglosado en pasos para que, cuando
# falle, se vea en el nombre del step si fue lint, tipos o tests, más el build.
#
# El build sí corre: `frontend/scripts/build-corpus.mjs` ya existe y, sin `output/`
# (que no se versiona), degrada al `frontend/public/data/corpus.json` versionado
# avisando por stderr, así que el prebuild no depende de artefactos del pipeline.
#
# Seguridad: no interpola ninguna entrada controlable por terceros (github.event.*)
# dentro de un `run:`. Si se añade alguna, pasarla por `env:` y citarla.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      # El prebuild genera public/data/normativa.json y public/data/preceptos/
      # desde knowledge/normativa/, y tests/normativa.test.ts contrasta el
      # articulado publicado contra esos mismos .md. Sin esta ruta, regenerar el
      # corpus normativo dejaba los datos del sitio obsoletos sin que ningún gate
      # lo viera: frontend.yml no se disparaba y ci.yml no corre vitest.
      - 'knowledge/normativa/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      # El prebuild genera public/data/normativa.json y public/data/preceptos/
      # desde knowledge/normativa/, y tests/normativa.test.ts contrasta el
      # articulado publicado contra esos mismos .md. Sin esta ruta, regenerar el
      # corpus normativo dejaba los datos del sitio obsoletos sin que ningún gate
      # lo viera: frontend.yml no se disparaba y ci.yml no corre vitest.
      - 'knowledge/normativa/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    name: lint + typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # engines.node del package.json exige >=24.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Biome
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build
